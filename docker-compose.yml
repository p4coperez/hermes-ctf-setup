
services:
  hermes-agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: hermes-agent-ctf:latest

    env_file:
      - .env
  
    container_name: ${HERMES_PROFILE:-hermes-agent}
    restart: unless-stopped
    stdin_open: true
    tty: true
    init: true
    command: ["hermes", "gateway", "run"]
    

    environment:
      - HERMES_AUTH_TOKEN=${HERMES_AUTH_TOKEN}
      - HERMES_MODEL=${HERMES_MODEL} # Compatibilidad con OpenRouter
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY} 
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_ALLOWED_USERS=${TELEGRAM_ALLOWED_USER_IDS}
      

    # --- Límites de recursos (VPS de 2 GB RAM) ---
    mem_limit: 1.5g          # techo duro de memoria del contenedor
    mem_reservation: 512m    # memoria "garantizada"
    cpus: "1.5"              # deja algo de CPU libre para el host
    pids_limit: 512          # evita fork-bombs accidentales de scripts

    ports:
      - "127.0.0.1:8642:8642"

    volumes:
      # Estado persistente del agente (memoria, skills, logs, config)
      - hermes_data:/root/.hermes
      # Carpeta de trabajo donde el agente ejecuta código/CTFs
      # aislada del resto del sistema de archivos del host
      - ./workspace:/workspace
      # Coloca aquí tu .ovpn de HTB/THM (uno solo, o el entrypoint
      # coge el primero que encuentre)
      - ./vpn:/vpn

    # Seguridad: privilegios mínimos, con la excepción necesaria
    # para levantar el túnel OpenVPN (tun/tap + rutas)
    security_opt:
      - no-new-privileges:true
    read_only: false   # el agente necesita escribir en /workspace y /root/.hermes
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_ADMIN      # requerido por OpenVPN para crear tun0 y rutas
    devices:
      - /dev/net/tun:/dev/net/tun

    networks:
      - hermes-net

volumes:
  hermes_data:

networks:
  hermes-net:
    driver: bridge
